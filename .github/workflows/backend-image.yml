name: Backend image

on:
  pull_request:
    branches: [develop, main]
    paths:
      - apps/backend/**
      - packages/**
      - infra/docker/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .trivyignore
      - .github/workflows/backend-image.yml
  push:
    branches: [develop]
    tags: ["v*"]

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tabacaria-backend
  LOCAL_TAG: tabacaria-backend:ci

jobs:
  image:
    name: Build, smoke test, scan and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare a database and throwaway secrets for the smoke test
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres tabacaria_image
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "COOKIE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run migrations from the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/tabacaria_image \
            -e STORE_CORS=http://localhost:3000 -e ADMIN_CORS=http://localhost:9000 \
            -e AUTH_CORS=http://localhost:3000 \
            -e JWT_SECRET -e COOKIE_SECRET \
            "$LOCAL_TAG" node_modules/.bin/medusa db:migrate

      - name: Start the server and wait for /health
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/tabacaria_image \
            -e STORE_CORS=http://localhost:3000 -e ADMIN_CORS=http://localhost:9000 \
            -e AUTH_CORS=http://localhost:3000 \
            -e JWT_SECRET -e COOKIE_SECRET \
            "$LOCAL_TAG"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health > /dev/null; then echo "healthy after $((i * 3)) s"; exit 0; fi
            sleep 3
          done
          docker logs api
          exit 1

      - name: Server logs
        if: always()
        run: docker logs api 2>&1 | tail -50 || true

      - name: Scan the image (high and critical with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
