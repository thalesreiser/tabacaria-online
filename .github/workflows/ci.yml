name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  backend-integration:
    name: Backend migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Used by @medusajs/test-utils to create one throwaway database per test suite.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Used by `medusa db:migrate` against a fresh database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tabacaria_ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create a fresh database
        run: createdb -h localhost -U postgres tabacaria_ci
      - name: Run migrations (first run)
        run: pnpm --filter @tabacaria/backend db:migrate
      - name: Run migrations again (setup scripts must be idempotent)
        run: pnpm --filter @tabacaria/backend db:migrate
      - name: Check the storefront publishable key exists
        if: hashFiles('apps/backend/src/scripts/publishable-key.ts') != ''
        run: pnpm --filter @tabacaria/backend store:publishable-key | grep -q "pk_"
      - name: Module integration tests
        run: pnpm --filter @tabacaria/backend test:integration:modules --passWithNoTests
      - name: HTTP integration tests
        run: pnpm --filter @tabacaria/backend test:integration:http --passWithNoTests

  storefront-e2e:
    name: Storefront E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabacaria/shared-types build
      - name: Install Chromium
        run: pnpm --filter @tabacaria/storefront exec playwright install --with-deps chromium
      - run: pnpm --filter @tabacaria/storefront test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
          retention-days: 7
