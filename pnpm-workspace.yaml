packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@changesets/cli": 3.0.3
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@eslint/js": 10.0.1
  "@types/node": 24.19.2
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  husky: 9.1.7
  lint-staged: 17.6.0
  prettier: 3.9.10
  typescript: 5.9.3
  typescript-eslint: 8.72.1

engineStrict: true

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - "@medusajs/telemetry"
  - "@swc/core"
  - esbuild

# tsconfig-paths: required by the Medusa CLI (same override as Medusa's official starter).
# lodash: GHSA-r5fr-rjxr-66jc, reaches us through @medusajs/cli > @graphql-codegen; the fix
# stays inside lodash 4.x.
overrides:
  tsconfig-paths: ^4.2.0
  "lodash@<4.18.0": ^4.18.1

# Advisories accepted after review (see docs/security/audit-exceptions.md). Review again when
# Medusa updates @graphql-codegen, at the latest on 2027-01-31.
auditConfig:
  ignoreGhsas:
    - GHSA-7mx3-vvmw-hjmv
    - GHSA-c4qx-w738-7hr3
