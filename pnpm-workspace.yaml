packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@changesets/cli": 3.0.3
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@eslint/js": 10.0.1
  "@types/node": 24.19.2
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  husky: 9.1.7
  lint-staged: 17.6.0
  prettier: 3.9.10
  typescript: 5.9.3
  typescript-eslint: 8.72.1

engineStrict: true

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - "@medusajs/telemetry"
  - "@swc/core"
  - esbuild

# Required by the Medusa CLI (same override as Medusa's official starter).
overrides:
  tsconfig-paths: ^4.2.0
